<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Hackathon Campo Real</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">CAMPO REAL<span> HACKATHON</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="cronograma.html">Cronograma</a></li>
                <li><a href="palestrantes.html">Palestrantes</a></li>
                <li><a href="inscricao.html">Inscrição</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h1 class="page-title">Garanta sua Vaga</h1>
         
        <form class="inscricao-form" action="#" method="POST">
            <fieldset>
                <legend>Dados da Equipe</legend>
                <label for="nomeEquipe">Nome da Equipe:</label>
                <input type="text" id="nomeEquipe" name="nomeEquipe" required placeholder="Ex: Time Alpha">
                
                <label for="emailLider">E-mail do Líder:</label>
                <input type="email" id="emailLider" name="emailLider" required placeholder="lider@email.com">
            </fieldset>
            
            <fieldset>
                <legend>Nível Técnico</legend>
                <label for="experiencia">Qual a experiência média do grupo?</label>
                <select id="experiencia" name="experiencia">
                    <option value="iniciante">Iniciante (1º a 3º semestre)</option>
                    <option value="intermediario">Intermediário (4º a 6º semestre)</option>
                    <option value="avancado">Avançado (7º semestre em diante)</option>
                </select>
            </fieldset>

            <div class="checkbox-group" style="margin: 20px 0; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="acessibilidade" name="acessibilidade">
                <label for="acessibilidade" style="margin: 0;">Nossa equipe possui necessidades de acessibilidade.</label>
            </div>

            <button type="submit" class="btn-main submit-btn">Confirmar Inscrição</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hackathon Campo Real</p>
    </footer>

</body>
</html>
